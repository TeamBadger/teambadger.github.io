<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000">
      <title>TeamBadger</title>
    <style>
        @font-face {
            font-family: 'DepartureMono-Regular';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/2409-1@1.0/DepartureMono-Regular.woff2') format('woff2');
            font-style: normal;
        }

        /* 1. 배경을 body에 직접 할당하여 레이어 최하단에 배치 */
        body {
    margin: 0;
    padding: 0;
    background-color: black;
    background-image: url("./images/backgroundimage.png");
    background-attachment: scroll; 
    background-repeat: no-repeat;
    background-position: center 120px; /* 배경도 중앙 기준으로 변경 */
    background-size: auto; 
    
    font-family: 'DepartureMono-Regular', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    
    /* --- 추가 및 수정된 부분 --- */
    width: 1000px;      /* PC 레이아웃 기준 너비 고정 */
    margin: 0 auto;     /* 화면 중앙 정렬 */
    min-height: 100vh;
    overflow-x: visible; /* 가로 잘림 방지 */
}
        
        /* 2. 상단 배너 */
        .top-banner {
            margin-top: 60px;
            width: 600px;
            z-index: 1; /* 배경보다 위에 오도록 설정 */
        }
        .top-banner img {
            width: 100%;
            display: block;
            image-rendering: pixelated;
        }

        /* 3. 가로 메뉴바 */
        /* 메뉴바 가로 정렬 유지 */
.main-nav {
    margin-top: 25px;
    display: flex;
    flex-direction: row; /* 가로 정렬 강제 고정 */
    gap: 12px;
    z-index: 1;
}
        .main-nav a img {
            height: 48px;
            display: block;
        }

        /* 기존 이젤 컨테이너 유지 */
.easel-container {
    margin-top: 50px;
    position: relative;
    width: 450px; 
    display: flex;
    justify-content: center;
    z-index: 1;
}

        .easel-image {
            width: 100%;
            display: block;
            image-rendering: pixelated;
        }

        /* 메모 칸 정밀 정렬 */
        .notepad-area {
            position: absolute;
            top: 76px;
            left: 50%;
            transform: translateX(-50%);
            
            width: 300px;
            height: 368px;
            
            background-color: white;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            
            font-family: 'DepartureMono-Regular', sans-serif;
            font-size: 14px;
            color: #333;
            line-height: 1.6;
            z-index: 2; /* 이젤 이미지보다 위에 위치 */
        }

        .notepad-title {
            font-size: 18px;
            text-align: center;
            border-bottom: 2px solid #000;
            margin-bottom: 15px;
            padding-bottom: 8px;
        }

        .update-item {
            margin-bottom: 15px;
            border-bottom: 1px dotted #ccc;
            padding-bottom: 8px;
        }

        .footer {
            margin-top: 100px;
            padding-bottom: 50px;
            color: #555;
            font-size: 11px;
            text-align: center;
            z-index: 1;
        }

        .notepad-area::-webkit-scrollbar { width: 5px; }
        .notepad-area::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="top-banner">
        <img src="./images/12173.png" alt="Main Banner">
    </div>

    <nav class="main-nav">
        <a href="About TeamBadger.html"><img src="./images/text1.png" onmouseover="this.src='./images/text2.png'" onmouseout="this.src='./images/text1.png'"></a>
        <a href="Story.html"><img src="./images/text3.png" onmouseover="this.src='./images/text4.png'" onmouseout="this.src='./images/text3.png'"></a>
        <a href="Game.html"><img src="./images/text5.png" onmouseover="this.src='./images/text6.png'" onmouseout="this.src='./images/text5.png'"></a>
        <a href="Gallery.html"><img src="./images/text7.png" onmouseover="this.src='./images/text8.png'" onmouseout="this.src='./images/text7.png'"></a>
        <a href="QnA.html"><img src="./images/text9.png" onmouseover="this.src='./images/text10.png'" onmouseout="this.src='./images/text9.png'"></a>
    </nav>

    <div class="easel-container">
        <img src="./images/frame1.png" alt="Update Easel" class="easel-image">
        
        <div class="notepad-area">
            <div class="notepad-title">:: UPDATE ::</div>
            
            <div class="update-item">
                <strong>2026.01.05</strong><br>
                - Update all other pages except the story,game page<br>
                
            </div>
            
            <div style="text-align: center; color: #999;">soon !</div>
        </div>
    </div>

    <div class="footer">
        &copy; 2025-<span id="year"></span> kokumotsu
    </div>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>

</body>
</html>
