<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title>Q&A - TeamBadger</title>
    <style>
        @font-face {
            font-family: 'DepartureMono-Regular';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/2409-1@1.0/DepartureMono-Regular.woff2') format('woff2');
            font-style: normal;
        }

        /* 2. 스크롤바 숨기기 (기능은 작동, 눈에만 안 보임) */
        html, body {
            -ms-overflow-style: none; /* IE and Edge */
            scrollbar-width: none; /* Firefox */
        }
        html::-webkit-scrollbar, body::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }
        
        body {
            background-color: black;
            color: white;
            font-family: 'DepartureMono-Regular', monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
            
            /* 3. 모바일에서 전체를 축소하여 보여주기 위한 설정 */
            width: 1200px; 
            margin: 0 auto; 
            overflow-x: hidden; /* 가로 스크롤 강제 제거 */
        }

        /* --- 상단 메뉴바 --- */
        .main-menu {
            margin-bottom: 80px;
        }
        .main-menu ul {
            list-style: none;
            padding: 0;
            display: flex;
            gap: 15px;
        }
        .menu-item img {
            display: block;
            transition: transform 0.2s;
        }
        .menu-item img:hover {
            transform: translateY(-3px);
        }

        /* --- 중앙 Q&A 박스 --- */
        .box26 {
            width: 650px; /* 고정 너비로 변경하여 레이아웃 안정화 */
            background-color: #1a1a1a;
            border-left: double 6px #999fad;
            border-right: double 6px #999fad;
            padding: 60px 40px;
            text-align: center;
            margin-bottom: 50px;
            box-sizing: border-box;
        }

        .qna-header {
            font-size: 24px;
            margin-bottom: 35px;
            letter-spacing: 2px;
            color: #fff;
        }

        /* --- 폼(입력창) 디자인 --- */
        .qna-form {
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
        }

        .custom-textarea {
            width: 100%;
            height: 200px;
            background-color: #2b2b2b;
            border: 2px solid #444;
            color: white;
            padding: 20px;
            font-family: inherit;
            font-size: 16px;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        .custom-textarea:focus {
            border-color: white;
        }

        .send-button {
            width: 160px;
            padding: 12px;
            background-color: white;
            color: black;
            border: none;
            font-family: inherit;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
        }

        .send-button:hover {
            background-color: #999fad;
            transform: scale(1.05);
        }

        /* --- 답변 리스트 --- */
        .qna-list {
            width: 650px; /* 메인 박스와 너비 통일 */
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin-bottom: 80px;
        }

        .answer-box {
            background-color: #1a1a1a;
            border-left: double 6px #999fad;
            border-right: double 6px #999fad;
            padding: 30px;
            text-align: left;
            box-sizing: border-box;
        }

        .question-text {
            color: #999fad;
            font-size: 14px;
            margin-bottom: 15px;
            display: block;
        }

        .question-text::before {
            content: "Q. ";
            font-weight: bold;
        }

        .answer-text {
            color: white;
            font-size: 16px;
            line-height: 1.6;
        }

        .answer-text::before {
            content: "A. ";
            font-weight: bold;
            color: white;
        }

        /* --- 푸터 --- */
        .copyright {
            padding-bottom: 40px;
            font-size: 12px;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>

    <nav class="main-menu">
        <ul>
            <li><a href="About TeamBadger.html" class="menu-item"><img src="./images/text1.png" alt="About" onmouseover="this.src='./images/text2.png'" onmouseout="this.src='./images/text1.png'"></a></li>
            <li><a href="Story.html" class="menu-item"><img src="./images/text3.png" alt="Story" onmouseover="this.src='./images/text4.png'" onmouseout="this.src='./images/text3.png'"></a></li>
            <li><a href="Game.html" class="menu-item"><img src="./images/text5.png" alt="Game" onmouseover="this.src='./images/text6.png'" onmouseout="this.src='./images/text5.png'"></a></li>
            <li><a href="Gallery.html" class="menu-item"><img src="./images/text7.png" alt="Gallery" onmouseover="this.src='./images/text8.png'" onmouseout="this.src='./images/text7.png'"></a></li>
            <li><a href="QnA.html" class="menu-item"><img src="./images/text9.png" alt="QnA" onmouseover="this.src='./images/text10.png'" onmouseout="this.src='./images/text9.png'"></a></li>
        </ul>
    </nav>

    <div class="box26">
        <div class="qna-header">QUESTION & ANSWER</div>
        <form action="https://formspree.io/f/xwvezlzk" method="POST" class="qna-form">
            <textarea name="message" class="custom-textarea" placeholder="Ask me something!" required></textarea>
            <button type="submit" class="send-button">SEND!</button>
        </form>
    </div>

    <div class="qna-list">
        <div class="answer-box">
            <span class="question-text">test</span>
            <div class="answer-text">test</div>
        </div>
    </div>

    <footer class="copyright">
        &copy; 2025-<span id="current-year"></span> kokumotsu
    </footer>

    <script>
        document.getElementById("current-year").textContent = new Date().getFullYear();
    </script>
</body>
</html>
