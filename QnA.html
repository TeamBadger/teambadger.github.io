<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q&A - TeamBadger</title>
    <style>
        /* 폰트 설정 */
        @font-face {
            font-family: 'DepartureMono-Regular';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/2409-1@1.0/DepartureMono-Regular.woff2') format('woff2');
            font-style: normal;
        }

        
        /* 기본 설정 */
        body {
            background-color: black;
            color: white;
            font-family: 'DepartureMono-Regular', monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center; /* 가로 중앙 정렬 */
            padding-top: 50px;
        }

        /* --- 상단 메뉴바 --- */
        .main-menu {
            margin-bottom: 80px; /* 배너가 없으므로 간격을 조금 더 넓힘 */
        }
        .main-menu ul {
            list-style: none;
            padding: 0;
            display: flex;
            gap: 15px;
        }
        .menu-item img {
            display: block;
            transition: transform 0.2s;
        }
        .menu-item img:hover {
            transform: translateY(-3px);
        }

        /* --- 중앙 Q&A 박스 (double border 디자인 유지) --- */
        .box26 {
            width: 85%;
            max-width: 650px;
            background-color: #1a1a1a;
            /* 양옆 두 줄 디자인 */
            border-left: double 6px #999fad;
            border-right: double 6px #999fad;
            padding: 60px 40px;
            text-align: center;
            margin-bottom: 50px;
            box-sizing: border-box;
        }

        .qna-header {
            font-size: 24px;
            margin-bottom: 35px;
            letter-spacing: 2px;
            color: #fff;
        }

        /* --- 폼(입력창) 디자인 --- */
        .qna-form {
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
        }

        .custom-textarea {
            width: 100%;
            height: 200px; /* 입력창을 조금 더 키움 */
            background-color: #2b2b2b;
            border: 2px solid #444;
            color: white;
            padding: 20px;
            font-family: inherit;
            font-size: 16px;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        .custom-textarea:focus {
            border-color: white;
        }

        .send-button {
            width: 160px;
            padding: 12px;
            background-color: white;
            color: black;
            border: none;
            font-family: inherit;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
        }

        .send-button:hover {
            background-color: #999fad;
            transform: scale(1.05);
        }

        /* --- 푸터 --- */
        .copyright {
            margin-top: auto; /* 페이지 하단으로 밀어냄 */
            padding-bottom: 30px;
            font-size: 12px;
            color: #666;
            text-align: center;
        }
        /* 답변들이 나열될 컨테이너 */
.qna-list {
    width: 85%;
    max-width: 650px;
    display: flex;
    flex-direction: column;
    gap: 30px; /* 답변 박스들 사이의 간격 */
    margin-bottom: 80px;
}

/* 개별 답변 박스 (기존 box26 디자인 계승) */
.answer-box {
    background-color: #1a1a1a;
    border-left: double 6px #999fad;
    border-right: double 6px #999fad;
    padding: 30px;
    text-align: left; /* 내용은 왼쪽 정렬이 읽기 편함 */
    box-sizing: border-box;
}

/* 질문 텍스트 스타일 */
.question-text {
    color: #999fad;
    font-size: 14px;
    margin-bottom: 15px;
    display: block;
}

.question-text::before {
    content: "Q. ";
    font-weight: bold;
}

/* 내 답변 텍스트 스타일 */
.answer-text {
    color: white;
    font-size: 16px;
    line-height: 1.6;
}

.answer-text::before {
    content: "A. ";
    font-weight: bold;
    color: white;
}
    </style>
</head>
<body>

    <nav class="main-menu">
        <ul>
            <li><a href="About TeamBadger.html" class="menu-item">
                <img src="./images/text1.png" alt="About" onmouseover="this.src='./images/text2.png'" onmouseout="this.src='./images/text1.png'">
            </a></li>
            <li><a href="Story.html" class="menu-item">
                <img src="./images/text3.png" alt="Story" onmouseover="this.src='./images/text4.png'" onmouseout="this.src='./images/text3.png'">
            </a></li>
            <li><a href="Game.html" class="menu-item">
                <img src="./images/text5.png" alt="Game" onmouseover="this.src='./images/text6.png'" onmouseout="this.src='./images/text5.png'">
            </a></li>
            <li><a href="Gallery.html" class="menu-item">
                <img src="./images/text7.png" alt="Gallery" onmouseover="this.src='./images/text8.png'" onmouseout="this.src='./images/text7.png'">
            </a></li>
            <li><a href="QnA.html" class="menu-item">
                <img src="./images/text9.png" alt="QnA" onmouseover="this.src='./images/text10.png'" onmouseout="this.src='./images/text9.png'">
            </a></li>
        </ul>
    </nav>

<div class="box26">
    <div class="qna-header">QUESTION & ANSWER</div>
    <form action="https://formspree.io/f/xwvezlzk" method="POST" class="qna-form">
        <textarea name="message" class="custom-textarea" placeholder="Ask me something!" required></textarea>
        <button type="submit" class="send-button">SEND!</button>
    </form>
</div>

<div class="qna-list">
    
    <div class="answer-box">
        <span class="question-text">test</span>
        <div class="answer-text">
            test
    </div>


</div>
    <footer class="copyright">
        &copy; 2025-<span id="current-year"></span> kokumotsu
    </footer>

    <script>
        document.getElementById("current-year").textContent = new Date().getFullYear();
    </script>
</body>
</html>
